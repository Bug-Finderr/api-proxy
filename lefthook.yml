# Biome pre-commit, per https://biomejs.dev/recipes/git-hooks/#lefthook
# (nubx instead of npx; safe fixes only at commit time - no --unsafe)
pre-commit:
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,mts,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
      run: nubx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
