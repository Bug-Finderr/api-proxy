name: Close PRs

on: pull_request_target

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close if not allowed
        if: ${{ github.actor != 'Bug-Finderr' }}
        run: gh pr close ${{ github.event.number }} --comment "This repo does not accept external PRs. Please open an issue instead." --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
