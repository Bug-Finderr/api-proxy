name = "api-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true
preview_urls = false

# Token store. Create with: nubx wrangler kv namespace create TOKENS
# then paste the returned id below before deploy. Local dev/tests use an in-memory namespace.
[[kv_namespaces]]
binding = "TOKENS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (set with `nubx wrangler secret put <NAME>`), never committed:
#   OPENAI_API_KEY  ANTHROPIC_API_KEY  GEMINI_API_KEY  ADMIN_SECRET
# Optional upstream overrides (plain vars, NOT secrets) default to the real hosts:
#   OPENAI_UPSTREAM  ANTHROPIC_UPSTREAM  GEMINI_UPSTREAM
