name = "api-proxy"
main = "src/index.ts"
# Keep in sync with vitest.config.ts (tier-1 miniflare does not read this file; tier-2 unstable_dev does).
compatibility_date = "2026-07-01"
workers_dev = true
preview_urls = false

# Persist console.* to Workers Logs (free plan: 200k events/day, 3-day retention - never a
# charge). Infrastructure failures log their cause; without this, only a live `wrangler tail`
# ever sees it.
[observability]
enabled = true

# Token store. Create with: nubx wrangler kv namespace create api-proxy-tokens
# then paste the returned id below before deploy. Local dev/tests use an in-memory namespace.
# Dedicated to api-proxy — must NOT be shared with any other worker.
[[kv_namespaces]]
binding = "TOKENS"
id = "1b212581e15144fb9f931b221a8cc5cd"

# Region-pinned egress relay (SQLite Durable Object, free plan). OpenAI calls that hit a
# geo-blocked egress colo are re-issued through this DO via the US jurisdiction namespace.
[[durable_objects.bindings]]
name = "US_EGRESS"
class_name = "UsEgress"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsEgress"]

# Per-token request-rate limit (Workers Rate Limiting binding; in-process, not a subrequest).
# Keyed on the token hash; one shared ceiling for all tokens (KISS). Tune `limit` freely;
# `period` must be 10 or 60. namespace_id is an arbitrary string-integer, unique per ruleset.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 100
  period = 60

# Dedicated low-rate throttle for /admin/login, keyed per client IP (`login:<ip>`). Separate
# ruleset so brute-force protection is not the proxy's 100/60 ceiling (~144k guesses/day).
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60

# Secrets (set with `nubx wrangler secret put <NAME>`), never committed:
#   OPENAI_API_KEY  ANTHROPIC_API_KEY  GEMINI_API_KEY  ADMIN_SECRET
# Optional upstream overrides (plain vars, NOT secrets) default to the real hosts:
#   OPENAI_UPSTREAM  ANTHROPIC_UPSTREAM  GEMINI_UPSTREAM
