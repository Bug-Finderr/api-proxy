name = "api-proxy"
main = "src/index.ts"
# Keep in sync with vitest.config.ts; tier 1 does not read this file.
compatibility_date = "2026-07-01"
workers_dev = true
preview_urls = false

# Retain console output so infrastructure failures remain diagnosable.
[observability]
enabled = true

# Dedicated token store; do not share it with another worker.
# Create with `nubx wrangler kv namespace create api-proxy-tokens`; tests use an in-memory namespace.
[[kv_namespaces]]
binding = "TOKENS"
id = "1b212581e15144fb9f931b221a8cc5cd"

# US-jurisdiction egress relay for OpenAI geo-block retries.
[[durable_objects.bindings]]
name = "US_EGRESS"
class_name = "UsEgress"

# Serializes admin token writes (KV alone has no atomic read-modify-write).
[[durable_objects.bindings]]
name = "TOKEN_WRITER"
class_name = "TokenWriter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsEgress"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TokenWriter"]

# Per-token, per-colo limit keyed by token hash; `period` must be 10 or 60.
# `namespace_id` is an arbitrary integer string unique to this ruleset.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 100
  period = 60

# Separate admin-login throttle keyed by client IP.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60

# Secrets (set with `nubx wrangler secret put <NAME>`), never committed:
#   OPENAI_API_KEY  ANTHROPIC_API_KEY  GEMINI_API_KEY  ADMIN_SECRET
# Optional upstream overrides (plain vars, NOT secrets) default to the real hosts:
#   OPENAI_UPSTREAM  ANTHROPIC_UPSTREAM  GEMINI_UPSTREAM
